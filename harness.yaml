name: kobayashi-workstation
version: 1.0.0

# 1. Starting Tier: Every session starts on the free local workhorse ($0.00 base)
starting_tier: workhorse

# 2. System-1 Router & Escalation Gate
router:
  engine: jev
  model: kev:4b
  escalation_threshold: 2           # After 2 failures, Workhorse escalates to Advisor

# 3. Model Hierarchy
tiers:
  # Advisor: Frontier reasoning for tough blockers & architecture
  advisor:
    provider: amazon-bedrock
    model: us.anthropic.claude-sonnet-5-5
    fallback_model: amazon-bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
    thinking: high
    fallback_thinking: high
    name: Claude Sonnet 5.5 (Bedrock Advisor)
    context_window: 1000000
    max_tokens: 128000
    reasoning: true
    temperature: 0.2
    mode: stateless
    max_turns_per_task: 2
    cost:
      input: 3.0
      output: 15.0
      cache_read: 0.3
      cache_write: 3.75

  # Orchestrator: Multi-file planning & tickets (currently Sonnet 5.5, easily swapped to SoL/Luna)
  orchestrator:
    provider: amazon-bedrock
    model: us.anthropic.claude-sonnet-5-5
    fallback_model: bedrock-mantle/openai.gpt-5.6-luna
    thinking: high
    fallback_thinking: medium
    name: Claude Sonnet 5.5 (Orchestrator)
    context_window: 1000000
    max_tokens: 128000
    reasoning: true
    temperature: 0.2
    cost:
      input: 3.0
      output: 15.0
      cache_read: 0.3
      cache_write: 3.75

  # Workhorse: Primary local model in RAM ($0.00), falls back to Luna if stuck
  workhorse:
    provider: ollama
    model: ornith-1.5:ctx
    fallback_model: bedrock-mantle/openai.gpt-5.6-luna
    thinking: max                   # Max thinking budget for local reasoning
    fallback_thinking: medium
    name: Ornith 1.5 (Local Custom 32K)
    context_window: 32768
    temperature: 0.1
    cost:
      input: 0.0
      output: 0.0
      cache_read: 0.0
      cache_write: 0.0

# 4. Token Efficiency & Noise Stripping
efficiency:
  sol_pi:
    action_fusion: true
    observation_pack: true
    online_context_compact: true
    evidence_preserving_reducer: false
    cache_write_read_ratio: 12.5
  spill_store:
    enabled: true
    threshold_tokens: 1500
  compaction:
    reserve_tokens: 6144

# 5. Safety Firewall
security:
  firewall: local
  blocked_commands:
    - rm -rf /
    - git reset --hard
    - sudo
    - npm publish
    - eval
  sandbox: codemode

# 6. Progressive Skills
skills:
  directory: .agents/skills
  loader: dynamic
  auto_detect_slash_commands: true
  max_header_words: 15

mcp:
  mode: deferred
  servers: {}

# ==============================================================================
# HARBOR EVALUATION SPECIFICATION: KOBAYASHI AGENT HARNESS
# Sandboxed evaluation benchmark suite matching Eneralabs AWS Strands depth
# ==============================================================================
version: "1.0"
benchmark_suite: "kobayashi-token-efficiency-v1"
environment:
  runner: "harbor"                  # Sandbox runner: docker | harbor | local
  docker_image: "ghcr.io/kobayashi/eval-sandbox:latest"
  timeout_per_task_sec: 180
  memory_limit: "4g"
  cpu_limit: "4"

# Comparative Harness Profiles Tested
agents:
  - id: "claude-code"
    name: "Claude Code (Direct Anthropic Baseline)"
    model: "claude-3-7-sonnet-20250219"
    harness: "none"                 # Raw token-maxing baseline
    compression: false
    dynamic_skills: false
    cached_pricing: false

  - id: "pi-vanilla"
    name: "Vanilla Pi Coding Agent"
    model: "claude-sonnet-4-5"
    harness: "pi-vanilla"
    compression: false
    dynamic_skills: false
    cached_pricing: true

  - id: "dsh-v4"
    name: "DeepSeek Harness (DSH V4 Pro)"
    model: "deepseek-v3.2"
    harness: "dsh"
    compression: true
    dynamic_skills: false
    cached_pricing: true

  - id: "kobayashi-full"
    name: "Kobayashi Multi-Tier Harness (Luna + Ornith + Sonnet 5.5)"
    models:
      advisor: "amazon-bedrock/us.anthropic.claude-sonnet-5-5:high"
      orchestrator: "bedrock-mantle/openai.gpt-5.6-luna:medium"
      workhorse: "ollama/ornith-1.5:ctx:low"
    harness: "kobayashi"
    compression: true               # SoL-Pi action-fusion + 97% observation packing
    dynamic_skills: true            # Zero token startup bloat
    quickjs_sandbox: true           # Deferred MCP +codemode execution
    circuit_breaker: true           # 2-turn failure escalation

# Benchmark Task Datasets
tasks:
  - "eval/datasets/dsa_sliding_window.json"
  - "eval/datasets/jenkins_pipeline_repair.json"
  - "eval/datasets/hyperdx_log_triage.json"
  - "eval/datasets/distributed_lock_race.json"

metrics:
  - "cost_usd"
  - "accuracy"
  - "turns"
  - "input_tokens"
  - "cache_read_tokens"
  - "cache_write_tokens"
  - "output_tokens"
  - "cache_hit_rate"
  - "wall_time_s"
  - "savings_vs_claude_code_pct"
